name: Multiplatform Release & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: false
        default: '1.0.0'
        type: string
      create_release:
        description: 'Create GitHub Release with all installers'
        required: false
        default: true
        type: boolean
      publish_stores:
        description: 'Upload builds to Google Play & App Store Connect (when secrets are set)'
        required: false
        default: true
        type: boolean
      play_track:
        description: 'Google Play release track'
        required: false
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      play_status:
        description: 'Google Play release status (use draft for first unreviewed app)'
        required: false
        default: 'completed'
        type: choice
        options:
          - completed
          - draft

permissions:
  contents: write
  pages: write
  id-token: write

env:
  PACKAGE_VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  android:
    name: Android (APK & AAB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve Android Version
        env:
          BUILD_NUMBER_OFFSET: ${{ vars.BUILD_NUMBER_OFFSET || '0' }}
        run: |
          RAW_VER="${PACKAGE_VERSION#v}"
          if [[ ! "$RAW_VER" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            RAW_VER="1.0.0"
          fi
          BUILD_NUM=$((GITHUB_RUN_NUMBER + BUILD_NUMBER_OFFSET))
          echo "APP_VERSION_NAME=$RAW_VER" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$BUILD_NUM" >> "$GITHUB_ENV"
          echo "Resolved Android version: $RAW_VER ($BUILD_NUM)"

      - name: Decode Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
            echo "KEYSTORE_FILE=release.jks" >> "$GITHUB_ENV"
          fi

      - name: Decode google-services.json (optional)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          fi

      - name: Build Signed Release APK & AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease \
            -PversionCode="$APP_VERSION_CODE" \
            -PversionName="$APP_VERSION_NAME"

      - name: Prepare Android artifacts
        run: |
          mkdir -p dist/android
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} dist/android/ \;
          find app/build/outputs/bundle/release -name "*.aab" -exec cp {} dist/android/ \;
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt dist/android/mapping.txt
          fi

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: |
            dist/android/*.apk
            dist/android/*.aab
            dist/android/mapping.txt
          if-no-files-found: error

  macos:
    name: macOS (.dmg)
    runs-on: macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Import Apple Developer ID Certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$MACOS_CERTIFICATE_P12_BASE64" ]; then
            KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
            KEYCHAIN_PASS="$(uuidgen)"
            echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"

            security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

            echo "MACOS_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          fi

      - name: Build & Sign macOS DMG
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
          MACOS_NOTARIZATION_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
          MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
        run: |
          if [ -n "$MACOS_SIGN_IDENTITY" ]; then
            ./gradlew :shared:packageReleaseDmg
            if [ -n "$MACOS_NOTARIZATION_APPLE_ID" ] && [ -n "$MACOS_NOTARIZATION_PASSWORD" ] && [ -n "$MACOS_NOTARIZATION_TEAM_ID" ]; then
              ./gradlew :shared:notarizeDmg
            fi
          else
            ./gradlew :shared:createReleaseDistributable
            APP_PATH=$(find shared/build/compose/binaries/main-release/app -maxdepth 1 -name "*.app" | head -n 1)
            if [ -n "$APP_PATH" ]; then
              codesign --force --deep --sign - "$APP_PATH"
            fi
            ./gradlew :shared:packageReleaseDmg
          fi

      - name: Prepare macOS artifacts
        run: |
          mkdir -p dist/macos
          find shared/build/compose/binaries/main-release/dmg -name "*.dmg" -exec cp {} dist/macos/ \;

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-release
          path: dist/macos/*.dmg
          if-no-files-found: error

  windows:
    name: Windows (.msi & .exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Windows MSI & EXE
        run: ./gradlew :shared:packageReleaseMsi :shared:packageReleaseExe

      - name: Sign Windows Installers (Authenticode)
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ($env:WINDOWS_CERTIFICATE_PFX_BASE64) {
            $certPath = Join-Path $env:RUNNER_TEMP "windows-cert.pfx"
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))

            $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse |
              Where-Object { $_.FullName -match "x64" } |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName

            $installers = Get-ChildItem -Path "shared/build/compose/binaries/main-release" -Include *.msi,*.exe -Recurse
            foreach ($file in $installers) {
              & $signtool sign /f $certPath /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 $file.FullName
            }
            Remove-Item $certPath -Force
          }

      - name: Prepare Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/windows" | Out-Null
          Get-ChildItem -Path "shared/build/compose/binaries/main-release" -Include *.msi,*.exe -Recurse |
            Copy-Item -Destination "dist/windows/"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: |
            dist/windows/*.msi
            dist/windows/*.exe
          if-no-files-found: error

  linux:
    name: Linux (.deb)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Linux DEB Package
        run: ./gradlew :shared:packageReleaseDeb

      - name: Prepare Linux artifacts
        run: |
          mkdir -p dist/linux
          find shared/build/compose/binaries/main-release/deb -name "*.deb" -exec cp {} dist/linux/ \;

      - name: Upload Linux DEB artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-release
          path: dist/linux/*.deb
          if-no-files-found: error

  ios:
    name: iOS & iPadOS (.ipa)
    runs-on: macos-15-intel
    outputs:
      export_method: ${{ steps.ios_build.outputs.export_method }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve iOS Version
        env:
          BUILD_NUMBER_OFFSET: ${{ vars.BUILD_NUMBER_OFFSET || '0' }}
        run: |
          RAW_VER="${PACKAGE_VERSION#v}"
          if [[ ! "$RAW_VER" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            RAW_VER="1.0.0"
          fi
          BUILD_NUM=$((GITHUB_RUN_NUMBER + BUILD_NUMBER_OFFSET))
          echo "IOS_MARKETING_VERSION=$RAW_VER" >> "$GITHUB_ENV"
          echo "IOS_BUILD_NUMBER=$BUILD_NUM" >> "$GITHUB_ENV"
          echo "Resolved iOS version: $RAW_VER ($BUILD_NUM)"

      - name: Decode GoogleService-Info.plist (optional)
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > iosApp/iosApp/GoogleService-Info.plist
          fi

      - name: Import iOS Certificate & Provisioning Profile
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -n "$IOS_CERTIFICATE_P12_BASE64" ] && [ -n "$IOS_PROVISIONING_PROFILE_BASE64" ]; then
            KEYCHAIN_PATH="$RUNNER_TEMP/ios-build.keychain-db"
            KEYCHAIN_PASS="$(uuidgen)"
            echo "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/ios-cert.p12"

            security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security import "$RUNNER_TEMP/ios-cert.p12" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

            SIGN_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(.*\)".*/\1/p' | head -n 1)
            if [ -n "$SIGN_IDENTITY" ]; then
              echo "IOS_SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"
            fi

            PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
            mkdir -p "$PROFILES_DIR"
            PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
            echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
            /usr/bin/security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
            UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/profile.plist")
            cp "$PROFILE_PATH" "$PROFILES_DIR/$UUID.mobileprovision"
            echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

            if /usr/libexec/PlistBuddy -c "Print ProvisionedDevices" "$RUNNER_TEMP/profile.plist" >/dev/null 2>&1; then
              echo "IOS_EXPORT_METHOD=release-testing" >> "$GITHUB_ENV"
            else
              echo "IOS_EXPORT_METHOD=app-store-connect" >> "$GITHUB_ENV"
            fi
          fi

      - name: Build iOS Archive & IPA
        id: ios_build
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          mkdir -p dist/ios
          if [ -n "$PROFILE_UUID" ] && [ -n "$IOS_TEAM_ID" ]; then
            EXPORT_METHOD="${IOS_EXPORT_METHOD:-app-store-connect}"
            xcodebuild -project iosApp/iosApp.xcodeproj \
              -scheme iosApp \
              -configuration Release \
              -sdk iphoneos \
              -archivePath "$RUNNER_TEMP/BlockBreaker.xcarchive" \
              MARKETING_VERSION="$IOS_MARKETING_VERSION" \
              CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
              DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="${IOS_SIGN_IDENTITY:-Apple Distribution}" \
              PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
              archive

            cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>$EXPORT_METHOD</string>
              <key>teamID</key>
              <string>$IOS_TEAM_ID</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>uploadSymbols</key>
              <true/>
              <key>provisioningProfiles</key>
              <dict>
                  <key>dev.vpestryakov.blockbreaker</key>
                  <string>$PROFILE_UUID</string>
              </dict>
          </dict>
          </plist>
          EOF

            xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/BlockBreaker.xcarchive" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
              -exportPath dist/ios

            echo "export_method=$EXPORT_METHOD" >> "$GITHUB_OUTPUT"
          else
            xcodebuild -project iosApp/iosApp.xcodeproj \
              -scheme iosApp \
              -configuration Release \
              -sdk iphoneos \
              -archivePath "$RUNNER_TEMP/BlockBreaker.xcarchive" \
              MARKETING_VERSION="$IOS_MARKETING_VERSION" \
              CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              archive

            rm -rf "$RUNNER_TEMP/Payload"
            mkdir -p "$RUNNER_TEMP/Payload"
            cp -R "$RUNNER_TEMP/BlockBreaker.xcarchive/Products/Applications/BlockBreaker.app" "$RUNNER_TEMP/Payload/"
            (cd "$RUNNER_TEMP" && zip -qry "$GITHUB_WORKSPACE/dist/ios/BlockBreaker-ios-unsigned.ipa" Payload)

            echo "export_method=unsigned" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-release
          path: dist/ios/*.ipa
          if-no-files-found: error

  publish-play-store:
    name: Publish to Google Play
    runs-on: ubuntu-latest
    needs: android
    if: ${{ !cancelled() && needs.android.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.publish_stores == 'true' || inputs.publish_stores == true))) }}
    steps:
      - name: Check Google Play credentials
        id: check
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret is not set; skipping Google Play upload."
          fi

      - name: Download Android artifacts
        if: steps.check.outputs.enabled == 'true'
        uses: actions/download-artifact@v8
        with:
          name: android-release
          path: android-artifacts

      - name: Upload AAB to Google Play
        if: steps.check.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.vpestryakov.block_breaker
          releaseFiles: android-artifacts/*.aab
          mappingFile: android-artifacts/mapping.txt
          track: ${{ github.event.inputs.play_track || 'internal' }}
          status: ${{ github.event.inputs.play_status || 'completed' }}

  publish-app-store:
    name: Publish to App Store Connect (TestFlight)
    runs-on: macos-15-intel
    needs: ios
    if: ${{ !cancelled() && needs.ios.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.publish_stores == 'true' || inputs.publish_stores == true))) }}
    steps:
      - name: Check App Store Connect credentials & build type
        id: check
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          EXPORT_METHOD: ${{ needs.ios.outputs.export_method }}
        run: |
          if [ "$EXPORT_METHOD" != "app-store-connect" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::iOS build was exported as '$EXPORT_METHOD' (need an App Store provisioning profile for TestFlight/App Store Connect upload); skipping upload."
          elif [ -n "$APP_STORE_CONNECT_API_KEY_ID" ] && [ -n "$APP_STORE_CONNECT_ISSUER_ID" ] && [ -n "$APP_STORE_CONNECT_API_KEY_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::App Store Connect API secrets are not configured; skipping TestFlight upload."
          fi

      - name: Download iOS IPA artifact
        if: steps.check.outputs.enabled == 'true'
        uses: actions/download-artifact@v8
        with:
          name: ios-release
          path: ios-artifacts

      - name: Upload IPA to App Store Connect (TestFlight)
        if: steps.check.outputs.enabled == 'true'
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          IPA_FILE=$(find ios-artifacts -name "*.ipa" | head -n 1)
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_FILE" \
            --api-key "$APP_STORE_CONNECT_API_KEY_ID" \
            --api-issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --show-progress

      - name: Clean up App Store Connect API key
        if: always()
        run: rm -rf ~/.appstoreconnect/private_keys

  publish-release:
    name: Publish Release & GitHub Pages
    runs-on: ubuntu-latest
    needs: [android, macos, windows, linux, ios]
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.create_release == 'true' || inputs.create_release == true))) && (needs.android.result == 'success' || needs.windows.result == 'success' || needs.linux.result == 'success' || needs.macos.result == 'success' || needs.ios.result == 'success') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          path: release-assets
          merge-multiple: true

      - name: Determine Release Tag
        id: tag
        run: |
          mkdir -p release-assets
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION="${{ github.event.inputs.version || '1.0.0' }}"
            VERSION="${VERSION#v}"
            TAG="v${VERSION}"
          fi
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: Block Breaker ${{ steps.tag.outputs.tag_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            release-assets/*.apk
            release-assets/*.aab
            release-assets/*.dmg
            release-assets/*.msi
            release-assets/*.exe
            release-assets/*.deb
            release-assets/*.ipa
          body: |
            **Block Breaker** — 10×10 Block Puzzle game built with Kotlin Multiplatform & Compose Multiplatform for Android, iOS, iPadOS, Windows, macOS, and Linux.

            🌐 **Download Landing Page**: [https://blockbreaker.vpestryakov.dev/](https://blockbreaker.vpestryakov.dev/)

            ### Downloads by Platform
            - **Android**: Download the `.apk` file to install directly on your phone/tablet (or `.aab` for Google Play).
            - **macOS**: Download the `.dmg` installer and drag **Block Breaker** to Applications.
            - **Windows**: Download the `.msi` or `.exe` installer.
            - **Linux**: Download the `.deb` package (`sudo dpkg -i block-breaker_*.deb`).
            - **iOS / iPadOS**: Download the `.ipa` package.

      - name: Prepare GitHub Pages site & installers
        run: |
          mkdir -p public/downloads
          touch public/.nojekyll
          echo "blockbreaker.vpestryakov.dev" > public/CNAME

          if [ -d release-assets ]; then
            DMG_FILE=$(find release-assets -name "*.dmg" | head -n 1)
            EXE_FILE=$(find release-assets -name "*.exe" | head -n 1)
            MSI_FILE=$(find release-assets -name "*.msi" | head -n 1)
            DEB_FILE=$(find release-assets -name "*.deb" | head -n 1)

            if [ -n "$DMG_FILE" ]; then cp "$DMG_FILE" public/downloads/BlockBreaker-macos.dmg; fi
            if [ -n "$EXE_FILE" ]; then cp "$EXE_FILE" public/downloads/BlockBreaker-windows.exe; fi
            if [ -n "$MSI_FILE" ]; then cp "$MSI_FILE" public/downloads/BlockBreaker-windows.msi; fi
            if [ -n "$DEB_FILE" ]; then cp "$DEB_FILE" public/downloads/BlockBreaker-linux.deb; fi
          fi

          sed "s/__VERSION__/${{ steps.tag.outputs.tag_name }}/g" .github/pages/index.html > public/index.html
          cp .github/pages/privacy.html public/privacy.html

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          cname: blockbreaker.vpestryakov.dev
          force_orphan: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        continue-on-error: true
        with:
          path: ./public

      - name: Deploy to GitHub Pages (Actions mode)
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

